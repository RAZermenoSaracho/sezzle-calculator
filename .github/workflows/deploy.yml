name: Deploy

# Runs on the repository's self-hosted runner after CI succeeds on main.
# Nothing is deployed until the repository variable DEPLOY_ENABLED is "true".
# See deploy/README.md for the operator setup this workflow depends on.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.DEPLOY_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main')
      )
    runs-on: [self-hosted, macOS]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Deploy to the Docker VM
        env:
          DOCKER_VM_DIR: ${{ vars.DOCKER_VM_DIR }}
          HOST_PORT: ${{ vars.HOST_PORT }}
        run: deploy/deploy.sh
      - name: Wait for health check
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'http://127.0.0.1:8080/api/health' }}
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "$HEALTH_URL"; then
              echo
              echo "Healthy after $attempt attempt(s)."
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed: $HEALTH_URL" >&2
          exit 1
